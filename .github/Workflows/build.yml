
name: Agra GUI - Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Project
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload Minecraft JAR
        uses: actions/upload-artifact@v4
        with:
          name: Agra-GUI-Fabric
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
